<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>树隙之间 · 二十九位登台者</title><style>
*{box-sizing:border-box}body{margin:0;background:#20251b;color:#e5d0a5;font:15px 'Microsoft YaHei','Source Han Sans SC',sans-serif}main{max-width:1500px;margin:auto;padding:42px 38px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #746447;padding-bottom:22px}h1{font-size:36px;letter-spacing:.16em;margin:10px 0}small{color:#a8b27f;letter-spacing:.23em}p{color:#b6a78b;line-height:1.7}a{color:inherit}nav{position:sticky;top:0;z-index:2;padding:16px 0;background:#20251bf5;display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;border:1px solid #756745;color:#e5d0a5;background:#303924;padding:8px 14px;cursor:pointer}.active{background:#697448;color:#fff4d6}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}article{background:radial-gradient(ellipse at center,#41452e,#242a1e 80%);border:1px solid #736244;padding:15px;text-align:center;position:relative}article small{position:absolute;top:10px;left:10px;font:11px Georgia;color:#b09d6c}canvas{display:block;width:100%;height:175px;object-fit:contain}h2{font-size:17px;font-weight:400;margin:10px 0 6px;letter-spacing:.1em}article a{font-size:11px;color:#a9b68a;text-decoration:none}footer{margin-top:30px;border-top:1px solid #746447;padding-top:20px;font-size:12px;color:#b6a78b}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}main{padding:24px 16px}h1{font-size:25px}}@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}canvas{height:150px}header{display:block}nav{gap:5px}button{font-size:12px;padding:7px}}
</style><main><header><div><small>THE HOLLOW CAST · 29 CHARACTERS</small><h1>二十九位登台者</h1><p>树隙之间 · 虫剧场角色图鉴</p></div><a href="index.html">进入虫剧场 ↗</a></header><nav id="poses"></nav><div id="grid" class="grid"></div><footer>粗墨描边 · 旧纸颗粒 · 复古手绘　／　每位角色八种动作</footer></main><script src="characters.js?v=cast29"></script><script>
let pose=0;const images=new Map(),labels=['待机','奔跑一','奔跑二','跳跃','冲刺','射击','受伤','胜利'];function paint(){for(const r of HOLLOW_CHARACTERS){const canvas=document.querySelector('[data-id="'+r.id+'"]'),ctx=canvas.getContext('2d'),im=images.get(r.id);ctx.clearRect(0,0,300,280);if(!im)continue;const b=r.frames[pose],scale=Math.min(270/b.w,250/b.h);ctx.drawImage(im,b.x,b.y,b.w,b.h,(300-b.w*scale)/2,270-b.h*scale,b.w*scale,b.h*scale)}}labels.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.classList.toggle('active',i===0);b.onclick=()=>{pose=i;document.querySelectorAll('nav button').forEach((x,j)=>x.classList.toggle('active',i===j));paint()};document.querySelector('#poses').append(b)});for(const r of HOLLOW_CHARACTERS){const card=document.createElement('article'),c=document.createElement('canvas');c.width=300;c.height=280;c.dataset.id=r.id;c.setAttribute('aria-label',r.name);const h=document.createElement('h2');h.textContent=r.name;const n=document.createElement('small');n.textContent=String(r.index+1).padStart(2,'0');const a=document.createElement('a');a.href='index.html?role='+encodeURIComponent(r.id);a.textContent='以此身份登台 ↗';card.append(n,c,h,a);document.querySelector('#grid').append(card);const im=new Image();im.onload=()=>{images.set(r.id,im);paint()};im.src=r.src}window.galleryReady=()=>images.size===HOLLOW_CHARACTERS.length;
</script></html>
