function resolveConflicts(indices){
 const alive=new Set(indices),events=[];
 const pending=CONFLICT_RULES.filter(r=>indices.some(i=>roles[i].生物===r.actor)&&indices.some(i=>roles[i].生物===r.target));
 while(pending.length){
  let k=pending.findIndex(r=>!pending.some(other=>other.target===r.actor));if(k<0)break;
  const r=pending.splice(k,1)[0],actor=indices.find(i=>roles[i].生物===r.actor),target=indices.find(i=>roles[i].生物===r.target);
  if(!alive.has(actor)||!alive.has(target))continue;
  alive.delete(target);events.push({...r,actorIndex:actor,targetIndex:target});
 }
 return {survivors:indices.filter(i=>alive.has(i)),events};
}

  awardConflict(nickFor(e.actorIndex),stimulus?'防御奏效':'食物链上游',e);
 }
 $('step').textContent='03 / 关系结局';$('start').hidden=true;
 $('routes').innerHTML=result.events.map(e=>`<article class="route"><h2>${escape(nickFor(e.targetIndex))}的本轮冒险结束</h2><p>被${escape(e.actor)}——${escape(nickFor(e.actorIndex))}${e.verb==='刺激'?'刺激而失败':'吃掉'}。</p><h3>成就：${e.verb==='刺激'?'刺激之下':'食物链的一环'}</h3><p>对方获得：${e.verb==='刺激'?'防御奏效':'食物链上游'}</p><button class="ghost" data-defeated-room="${e.targetIndex}">查看成就室</button><details><summary>关系依据</summary><p>这是根据关系表设置的游戏结局。</p><p>${escape(e.basis)}</p><a href="${escape(e.source)}" target="_blank" rel="noopener">查看来源</a></details></article>`).join('')+`<button class="primary" id="continue-survivors">其余角色继续探索 ↗</button>`;
 $('routes').querySelectorAll('[data-defeated-room]').forEach(b=>b.onclick=()=>window.hollowPersonalQA.openRoom(nickFor(+b.dataset.defeatedRoom),'achievements'));
 $('continue-survivors').onclick=()=>{selected=result.survivors;mapResults()};
},true);
window.hollowConflictQA={resolveConflicts};
