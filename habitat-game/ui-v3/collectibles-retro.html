<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洞藏重绘 · 虫剧场</title><style>
:root{font-family:'Microsoft YaHei','Source Han Sans SC',sans-serif;background:#201a13;color:#e9d6ad}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#594129,transparent 65%)}header{padding:45px max(28px,5vw) 26px;border-bottom:1px solid #8b6a3d}h1{font-size:clamp(30px,4vw,58px);margin:0 0 14px;letter-spacing:3px}header p{margin:8px 0;color:#bea780}nav{position:sticky;top:0;z-index:2;padding:17px max(28px,5vw);background:#241c13f5;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid #745834}button,a{font:inherit;color:inherit}button{border:1px solid #866d49;background:#392b1b;padding:10px 20px;border-radius:30px;cursor:pointer}button[aria-pressed=true]{background:#d2ab65;color:#20180d}main{max-width:1600px;margin:0 auto;padding:32px 30px 60px}h2{font-size:26px;border-left:5px solid #c98b44;padding-left:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}article{background:#e7d2a51a;border:1px solid #a8864c45;border-radius:12px;padding:16px;text-align:center}article img{width:100%;height:205px;object-fit:contain;filter:drop-shadow(0 8px 8px #0005)}article h3{font-size:18px;margin:12px 0 8px;line-height:1.55}article small{display:block;color:#bfa782;line-height:1.8}article a{font-size:13px;display:inline-block;margin-top:12px;text-underline-offset:4px;color:#d7b57a}.tag{border:1px solid var(--tier);color:var(--tier);border-radius:20px;padding:3px 12px;display:inline-block;font-size:12px;margin-bottom:8px}.note{border:1px solid #ba9056;padding:18px 22px;background:#513b2159;line-height:1.8;margin-bottom:24px}.hidden{display:none}footer{color:#9f8763;text-align:center;padding:24px;font-size:13px}@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}main{padding:20px 12px}article{padding:10px}article img{height:145px}article h3{font-size:15px}button{padding:9px 12px}}
</style></head><body><header><h1>虫剧场 · 洞藏画册</h1><p>旧纸颗粒、手绘墨线与树隙里的小小收藏。</p><p>43 件常规藏品 · 5 件随机事件限定</p></header><nav id="tabs"></nav><main><section id="normal"><h2>常规洞藏</h2><div class="grid" id="regular-grid"></div></section><section id="limited"><h2>随机事件限定</h2><p class="note">以下 5 件为后续随机事件预留，仅展示原画，不加入搜索掉落。价值、占格和事件获得方式等待后续定义。</p><div class="grid" id="event-grid"></div></section></main><footer>透明底原画 · 图片内无文字与 UI 边框</footer><script src="collectibles-retro.js"></script><script>
const labels={white:'白色',blue:'蓝色',purple:'紫色',gold:'金色',rainbow:'彩色'},colors={white:'#eee2c4',blue:'#85bcce',purple:'#b59bc7',gold:'#e7bd63',rainbow:'#d6b2cc'};let active=location.hash==='#event'?'event':'all';
function render(){for(const [id,eventOnly]of [['regular-grid',false],['event-grid',true]]){const items=RETRO_ITEMS.filter(i=>i.eventOnly===eventOnly&&(active==='all'||active==='event'&&eventOnly||active===i.tier&&!eventOnly));document.getElementById(id).innerHTML=items.map(i=>'<article style="--tier:'+colors[i.tier]+'"><span class="tag">'+(i.rarityLabel||labels[i.tier])+'</span><img src="'+i.src+'" alt="'+i.name+'"><h3>'+i.name+'</h3><small>'+(i.eventOnly?'事件限定 · 未投放':i.w+'×'+i.h+' 格 · '+i.value.toLocaleString()+' 价值')+'</small><a href="'+i.src+'" download="'+i.name+'.webp">透明 WebP 原画</a></article>').join('');document.getElementById(eventOnly?'limited':'normal').classList.toggle('hidden',!items.length)}document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.filter===active))}
for(const[k,label]of [['all','全部 48 件'],...Object.entries(labels),['event','事件限定 5 件']]){const b=document.createElement('button');b.dataset.filter=k;b.textContent=label;b.onclick=()=>{active=k;render()};document.getElementById('tabs').append(b)}render();
</script></body></html>
